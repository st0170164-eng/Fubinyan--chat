```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和付彬言聊天</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#f5f2ef;
  color:#292929;
}
header{
  background:#fff;
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #eee;
  position:sticky;top:0;
}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:#d8d4d0;display:grid;place-items:center;
  font-size:20px;
}
header h3{margin:0;font-size:17px}
header small{color:#888}
#chat{
  padding:18px 14px 100px;
  max-width:650px;margin:auto;
}
.date{text-align:center;color:#999;font-size:12px;margin:12px}
.msg{display:flex;gap:8px;margin:18px 0;align-items:flex-end}
.msg.me{justify-content:flex-end}
.bubble{
  max-width:78%;padding:12px 15px;border-radius:18px;
  background:#fff;line-height:1.6;overflow-wrap:anywhere;
  box-shadow:0 1px 3px #00000008;
}
.me .bubble{background:#dce8dc;border-bottom-right-radius:5px}
.them .bubble{border-bottom-left-radius:5px}
.name{font-size:11px;color:#999;margin:0 0 4px 4px}
#typing{color:#999;font-size:13px;padding:0 20px 12px}
footer{
  position:fixed;bottom:0;left:0;right:0;
  background:#ffffffed;padding:12px;
  border-top:1px solid #eee;
}
form{max-width:650px;margin:auto;display:flex;gap:8px}
input{
  min-width:0;flex:1;border:1px solid #ddd;border-radius:24px;
  padding:13px 16px;font-size:16px;outline:none;
}
button{
  border:0;border-radius:24px;background:#333;color:white;
  padding:0 20px;font-size:15px;
}
.note{text-align:center;color:#aaa;font-size:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="avatar">言</div>
  <div>
    <h3>付彬言</h3>
    <small>聊天中 · 角色互動</small>
  </div>
</header>

<main id="chat">
  <div class="date">今天</div>
  <div class="msg them">
    <div>
      <div class="name">付彬言</div>
      <div class="bubble">嗯？找我有事？</div>
    </div>
  </div>
</main>
<div id="typing"></div>

<footer>
  <form id="form">
    <input id="input" placeholder="傳訊息給付彬言…" autocomplete="off">
    <button type="submit">傳送</button>
  </form>
  <div class="note">互動角色 · 非本人</div>
</footer>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const typing=document.getElementById('typing');

function addMessage(text,me){
  const row=document.createElement('div');
  row.className='msg '+(me?'me':'them');
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.textContent=text;
  row.appendChild(bubble);
  chat.appendChild(row);
  window.scrollTo(0,document.body.scrollHeight);
}

function reply(text){
  if(/在嗎|在不在/.test(text)) return '在。怎麼了？';
  if(/你好|嗨|哈囉/.test(text)) return '嗯，怎麼突然找我？';
  if(/累|好煩|不開心|難過/.test(text)) return '怎麼了？發生什麼事了？';
  if(/作業|考試|讀書/.test(text)) return '又是學校的事？哪裡不會？';
  if(/吃飯|吃了嗎/.test(text)) return '吃了。你呢？';
  if(/晚安/.test(text)) return '嗯，晚安。明天再聊。';
  if(/哈哈|笑死/.test(text)) return '有這麼好笑？';
  if(/喜歡你|喜歡我/.test(text)) return '……你怎麼突然講這個？';
  if(/謝謝/.test(text)) return '小事。';
  return '嗯？你繼續說。';
}

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  addMessage(text,true);
  input.value='';
  typing.textContent='付彬言正在輸入…';
  setTimeout(()=>{
    typing.textContent='';
    addMessage(reply(text),false);
  },700);
});
</script>
</body>
</html>
